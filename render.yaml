# One-click deploy on Render (render.com): New + > Blueprint > pick this repo.
services:
  - type: web
    name: beacon-isle
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
